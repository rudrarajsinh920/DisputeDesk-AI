# Render Blueprint for the DisputeDesk API (Express + SQLite). The page is served by Vercel (vercel.json),
# which forwards /api/* here. Demo data only: no PayPal or Gemini keys are set, so both stay off.
services:
  - type: web
    name: disputedesk-api-rudra
    runtime: node
    # Free plan: no persistent disk. The database is rebuilt from the demo files on every start, so sign-ins and
    # uploads are lost when the service sleeps (after 15 idle minutes) or redeploys. A paid plan can add a disk.
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    envVars:
      # node:sqlite and running .ts files directly need Node 24.
      - key: NODE_VERSION
        value: 24.20.0
      - key: HOST
        value: 0.0.0.0
      # Vercel's proxy, then Render's: two hops add X-Forwarded-For, so sign-in limits see the visitor's address.
      - key: TRUST_PROXY
        value: "2"
      # Set in the Render dashboard after the first deploy:
      # ALLOWED_HOSTS = this service's onrender.com name, e.g. disputedesk-api-rudra.onrender.com
      # PAGE_ORIGINS  = the Vercel page, e.g. https://disputedesk.vercel.app
      - key: ALLOWED_HOSTS
        sync: false
      - key: PAGE_ORIGINS
        sync: false
